<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa Unical</title>
<meta name="description" content="I prodotti Unical dentro una casa: guardali lavorare lungo una giornata, poi aprili e smontali pezzo per pezzo. A cura di Borelli Impianti.">
<meta property="og:title" content="Casa Unical">
<meta property="og:description" content="I prodotti Unical dentro una casa: guardali lavorare lungo una giornata, poi aprili e smontali pezzo per pezzo.">
<meta property="og:type" content="website">
<meta property="og:image" content="<!--BASE-->og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0f13">
<!--FONTS-->
<!--IMPORTMAP-->
<style>
  :root { color-scheme: dark; --ink: #eef2f0; --dim: #a9b4b1; --line: rgba(255,255,255,.18); --green: #a9bd8f; --heat: #ff9a4d; --ice: #8fd3ff; --bg: #0b0f13; --panel: rgba(13,18,22,.82);
    --pad: clamp(12px, 2.4vmin, 28px); --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: Barlow, system-ui, sans-serif }
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent }
  #stage { position: fixed; inset: 0; overflow: hidden }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab }
  button { font: inherit; color: inherit }
  .btn, .big { pointer-events: auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
    font: 600 15px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(8px) }
  .big { background: var(--green); color: #10140f; border-color: transparent; font-size: 17px; min-height: 52px; padding: 0 24px }
  .big:disabled { background: var(--panel); color: var(--dim); border-color: var(--line); cursor: default }
  .btn:hover, .btn:focus-visible { border-color: var(--green) } :focus-visible { outline: 2px solid var(--green); outline-offset: 2px }

  #top { position: absolute; left: 0; right: 0; top: 0; padding: var(--pad); padding-top: max(var(--pad), env(safe-area-inset-top)); display: flex; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none }
  #logo { width: clamp(84px, 13vmin, 124px); line-height: 0; filter: drop-shadow(0 1px 6px rgba(0,0,0,.35)) } #logo svg { width: 100%; height: auto }
  #by { font: 600 clamp(12px, 1.7vmin, 15px)/1.2 var(--display); letter-spacing: .12em; text-transform: uppercase; text-align: right; text-shadow: 0 1px 8px rgba(0,0,0,.6) } #by span { color: var(--green) }

  .scena { position: absolute; inset: 0; display: none; pointer-events: none }
  body[data-scena=home] #home, body[data-scena=casa] #casa { display: block }

  /* Home */
  #hInfo { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px var(--pad) max(var(--pad), env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
    background: linear-gradient(transparent, rgba(5,8,10,.92) 46%) }
  #hNum { font: 600 13px/1 var(--display); letter-spacing: .2em; color: var(--green) }
  #hName { margin: 0; font: 700 clamp(38px, 8vmin, 64px)/.95 var(--display); letter-spacing: .04em; text-transform: uppercase }
  #hLine { margin: 0; color: var(--dim); font-size: clamp(14px, 2vmin, 17px); min-height: 1.3em }
  #hRow { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 4px }
  .credit { margin: 4px 0 0; font-size: 12px; color: var(--dim) }
  .freccia { position: absolute; top: 44%; width: 46px; height: 46px; padding: 0; font-size: 26px; letter-spacing: 0 } #bPrev { left: var(--pad) } #bNext { right: var(--pad) }
  #hHint { position: absolute; left: 0; right: 0; top: calc(var(--pad) + 62px); text-align: center; font: 500 13px/1.3 var(--body); color: var(--dim); letter-spacing: .04em; text-shadow: 0 1px 8px #000 }

  /* Casa */
  #cTop { position: absolute; left: var(--pad); right: var(--pad); top: calc(max(var(--pad), env(safe-area-inset-top)) + 54px); display: flex; flex-direction: column; align-items: flex-start; gap: 10px }
  #cCap { pointer-events: auto; max-width: 560px; padding: 12px 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center }
  #cHour { font: 700 clamp(30px, 6vmin, 44px)/1 var(--display); letter-spacing: .04em; font-variant-numeric: tabular-nums; grid-row: span 2 }
  #cChip { display: flex; flex-wrap: wrap; gap: 6px } #cStato, #cAcs { font: 600 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; background: rgba(255,255,255,.1) }
  #cAcs[data-m=c] { background: #ff6a4a; color: #1b0805 } #cAcs[data-m=r] { background: rgba(255,154,77,.28) }
  #cStato[data-m=c] { background: var(--heat); color: #1b0f05 } #cStato[data-m=f] { background: var(--ice); color: #05121b }
  #cText { margin: 0; font-size: clamp(13px, 1.9vmin, 15px); line-height: 1.35; min-height: 2.7em }
  #cPanel { position: absolute; left: 50%; bottom: max(var(--pad), env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(calc(100% - 2 * var(--pad)), 640px); pointer-events: auto; padding: 12px 14px 10px; border-radius: 16px;
    background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 10px }
  #cPanel h2 { margin: 0; font: 600 13px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--dim) }
  #cRow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden }
  .seg button, #bPlay { min-height: 44px; padding: 0 16px; border: 0; background: transparent; font: 600 14px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer }
  .seg button[aria-pressed=true] { background: var(--green); color: #10140f }
  #bPlay { border: 1px solid var(--line); border-radius: 999px; min-width: 92px }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: 0; background: transparent; cursor: pointer; --f: 30% }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--green) var(--f), rgba(255,255,255,.2) var(--f)) }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.2) } input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--green) }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 10px rgba(0,0,0,.5) }
  input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 0 }
  #ore { display: flex; justify-content: space-between; font: 500 11px/1 var(--body); color: var(--dim); font-variant-numeric: tabular-nums; margin-top: -6px }
  .tag { position: absolute; left: 0; top: 0; pointer-events: auto; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--green); color: #10140f; font: 700 14px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
    box-shadow: 0 6px 22px rgba(0,0,0,.45); white-space: nowrap }
  .tag::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 14px; background: var(--green); transform: translateX(-50%) }

  #prod { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg) } #prod[hidden] { display: none }
  body[data-scena=prodotto] #top { display: none }
  body[data-scena=casa] #top { background: linear-gradient(rgba(5,8,10,.72), transparent) }
  #veil { position: absolute; inset: 0; background: var(--bg); opacity: 1; pointer-events: none; transition: opacity .38s ease }
  body.pronto #veil { opacity: 0 } body.pronto #veil.on { opacity: 1; pointer-events: auto }
  @media (max-height: 460px) { #hName { font-size: 30px } #hInfo { gap: 5px; padding-top: 16px } #hNum, .credit, #hHint, #ore, #cPanel h2 { display: none } .big, .btn { min-height: 42px }
    #cTop { top: var(--pad); left: calc(var(--pad) + 110px); right: calc(var(--pad) + 130px); flex-direction: row; align-items: center } #cCap { padding: 6px 12px; flex: 1; max-width: 520px } #cHour { font-size: 24px } #cText { min-height: 0; font-size: 12px; line-height: 1.25 }
    #cPanel { flex-direction: row; align-items: center; padding: 6px 10px; gap: 12px; width: min(calc(100% - 2 * var(--pad)), 760px) } #cRow { flex-wrap: nowrap } .seg button, #bPlay { min-height: 40px; padding: 0 12px } }
  @media (max-width: 480px) { .freccia { top: 36% } }
  body.solo .freccia, body.solo #hNum { display: none }
  /* fotogramma per l'anteprima del link (og.jpg): si attiva da script con la classe "og" */
  #ogT { display: none; position: absolute; left: 44px; bottom: 40px; right: 44px; text-shadow: 0 2px 18px rgba(0,0,0,.7) } #ogT b { display: block; font: 700 92px/.95 var(--display); letter-spacing: .03em; text-transform: uppercase } #ogT span { display: block; margin-top: 12px; font: 500 30px/1.2 var(--body) }
  body.og .scena, body.og #by { display: none !important } body.og #ogT { display: block } body.og #logo { width: 190px } body.og #top { padding: 36px 44px }
  body.og #stage::after { content: ""; position: absolute; inset: 45% 0 0 0; background: linear-gradient(transparent, rgba(5,8,10,.85)); pointer-events: none } body.og #ogT { z-index: 2 }
  @media (prefers-reduced-motion: reduce) { #veil { transition: none } }
</style>
</head>
<body data-scena="">
<div id="stage">
  <canvas id="gl" aria-label="Casa Unical: i prodotti Unical in tre dimensioni"></canvas>
  <header id="top"><div id="logo"></div><div id="by">Casa Unical<br><span>Borelli Impianti</span></div></header>

  <section id="home" class="scena" aria-label="I prodotti">
    <p id="hHint">Trascina per girare · tocca il prodotto per aprirlo</p>
    <button class="btn freccia" id="bPrev" type="button" aria-label="Prodotto precedente">&#8249;</button>
    <button class="btn freccia" id="bNext" type="button" aria-label="Prodotto successivo">&#8250;</button>
    <div id="hInfo">
      <div id="hNum">01 / 01</div>
      <h1 id="hName">UHP 120</h1>
      <p id="hLine"></p>
      <div id="hRow"><button class="big" id="bOpen" type="button">Apri</button><button class="btn" id="bCasa" type="button">Entra nella casa</button></div>
    </div>
  </section>

  <section id="casa" class="scena" aria-label="La casa">
    <div id="cTop">
      <button class="btn" id="bHome" type="button">&#8249; Prodotti</button>
      <div id="cCap"><b id="cHour">07:00</b><span id="cChip"><span id="cStato">A riposo</span><span id="cAcs">Acqua calda: pronta</span></span><p id="cText"></p></div>
    </div>
    <div id="tags"></div>
    <div id="cPanel">
      <div id="cRow"><h2>Una giornata in casa</h2><div class="seg"><button id="bInv" type="button" aria-pressed="true">Inverno</button><button id="bEst" type="button" aria-pressed="false">Estate</button></div><button id="bPlay" type="button" aria-pressed="true">Pausa</button></div>
      <input type="range" id="sDay" min="0" max="24" step="0.05" value="7" aria-label="Ora del giorno">
      <div id="ore"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
    </div>
  </section>

  <div id="ogT"><b>Casa Unical</b><span>I prodotti Unical al lavoro dentro una casa. A cura di Borelli Impianti.</span></div>
  <iframe id="prod" title="Prodotto" hidden allow="autoplay; fullscreen"></iframe>
  <div id="veil"></div>
</div>
<script type="module">
/*SCRIPT*/
</script>
</body>
</html>

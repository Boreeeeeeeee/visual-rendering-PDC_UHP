<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casa Unical</title>
<meta name="description" content="I prodotti Unical dentro una casa: guardali lavorare lungo una giornata, poi aprili e smontali pezzo per pezzo.">
<meta property="og:title" content="Casa Unical">
<meta property="og:description" content="I prodotti Unical dentro una casa: guardali lavorare lungo una giornata, poi aprili e smontali pezzo per pezzo.">
<meta property="og:type" content="website">
<meta property="og:image" content="<!--BASE-->og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0f13">
<!--FONTS-->
<!--IMPORTMAP-->
<style>
  :root { color-scheme: dark; --ink: #eef2f0; --dim: #a9b4b1; --line: rgba(255,255,255,.18); --green: #a9bd8f; --heat: #ff9a4d; --ice: #8fd3ff; --bg: #0b0f13; --panel: rgba(13,18,22,.82);
    --pad: clamp(12px, 2.4vmin, 28px); --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: Barlow, system-ui, sans-serif }
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent }
  #stage { position: fixed; inset: 0; overflow: hidden }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab }
  button { font: inherit; color: inherit }
  .btn, .big { pointer-events: auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
    font: 600 15px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(8px) }
  .big { background: var(--green); color: #10140f; border-color: transparent; font-size: 17px; min-height: 52px; padding: 0 24px }
  .big:disabled { background: var(--panel); color: var(--dim); border-color: var(--line); cursor: default }
  .btn:hover, .btn:focus-visible { border-color: var(--green) } :focus-visible { outline: 2px solid var(--green); outline-offset: 2px }

  #top { position: absolute; z-index: 2; left: 0; right: 0; top: 0; padding: var(--pad); padding-top: max(var(--pad), env(safe-area-inset-top)); display: flex; align-items: center; justify-content: space-between; gap: 12px; pointer-events: none }
  #logo { width: clamp(84px, 13vmin, 124px); line-height: 0; filter: drop-shadow(0 1px 6px rgba(0,0,0,.35)) } #logo svg { width: 100%; height: auto }
  #by { font: 600 clamp(12px, 1.7vmin, 15px)/1.2 var(--display); letter-spacing: .12em; text-transform: uppercase; text-align: right; text-shadow: 0 1px 8px rgba(0,0,0,.6) } #by span { color: var(--green) }

  .scena { position: absolute; inset: 0; display: none; pointer-events: none }
  body[data-scena=home] #home, body[data-scena=casa] #casa { display: block }

  /* Home */
  #hInfo { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px var(--pad) max(var(--pad), env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
    background: linear-gradient(transparent, rgba(5,8,10,.92) 46%) }
  #hNum { font: 600 13px/1 var(--display); letter-spacing: .2em; color: var(--green) }
  #hName { margin: 0; font: 700 clamp(38px, 8vmin, 64px)/.95 var(--display); letter-spacing: .04em; text-transform: uppercase }
  #hLine { margin: 0; color: var(--dim); font-size: clamp(14px, 2vmin, 17px); min-height: 1.3em }
  #hRow { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 4px }
  .credit { margin: 4px 0 0; font-size: 12px; color: var(--dim) }
  .freccia { position: absolute; top: 44%; width: 46px; height: 46px; padding: 0; font-size: 26px; letter-spacing: 0 } #bPrev { left: var(--pad) } #bNext { right: var(--pad) }
  #hHint { position: absolute; left: 0; right: 0; top: calc(var(--pad) + 62px); text-align: center; font: 500 13px/1.3 var(--body); color: var(--dim); letter-spacing: .04em; text-shadow: 0 1px 8px #000 }

  /* Casa: la giornata a momenti */
  body[data-scena=casa] #by { display: none }
  #bHome { position: absolute; right: var(--pad); top: max(var(--pad), env(safe-area-inset-top)); pointer-events: auto; min-height: 40px; padding: 0 14px; font-size: 14px }
  #cSpot { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse var(--rx, 40vw) var(--ry, 40vh) at var(--sx, 50%) var(--sy, 50%), rgba(4,7,9,0) 50%, rgba(4,7,9,.5) 100%) }
  #cCard { position: absolute; left: var(--pad); top: calc(max(var(--pad), env(safe-area-inset-top)) + 52px); width: min(calc(100% - 2 * var(--pad)), 420px); pointer-events: auto;
    padding: 9px 14px 10px; border-radius: 14px; background: rgba(13,18,22,.72); border: 1px solid var(--line); backdrop-filter: blur(10px) }
  #cHead { display: flex; align-items: center; gap: 12px }
  #cHour { font: 700 24px/1 var(--display); letter-spacing: .03em; font-variant-numeric: tabular-nums }
  #cTit { flex: 1; min-width: 0; font: 700 15px/1.1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--green); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  #cNum { font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); white-space: nowrap }
  #cText { margin: 5px 0 0; font-size: 14px; line-height: 1.36 }
  #cCard.nuovo #cTit, #cCard.nuovo #cText { animation: nuovo .6s ease both } @keyframes nuovo { from { opacity: 0; transform: translateY(5px) } }
  #cBar { position: absolute; left: 50%; bottom: max(var(--pad), env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(calc(100% - 2 * var(--pad)), 900px); pointer-events: auto;
    display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px) }
  #cOpt { display: flex; gap: 8px; flex: none } #cGen[hidden] { display: none }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden }
  .seg button { white-space: nowrap; min-height: 40px; padding: 0 14px; border: 0; background: transparent; font: 600 13px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer }
  .seg button[aria-pressed=true] { background: var(--green); color: #10140f }
  #cRun { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px }
  .tondo { flex: none; width: 42px; height: 42px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; cursor: pointer; font: 600 24px/1 var(--display) }
  #bPlay { width: 46px; height: 46px; background: var(--green); color: #10140f; border-color: transparent } #bPlay svg { width: 16px; height: 16px; fill: currentColor }
  /* barra del giorno: sopra i simboli dei momenti (si toccano), in mezzo il cielo della giornata con l'ora che scorre, sotto le ore */
  #cDay { position: relative; flex: 1; min-width: 0; display: grid; gap: 3px }
  #cIcons { position: relative; height: 32px }
  .mi { position: absolute; top: 0; width: 32px; height: 32px; margin-left: -16px; padding: 0; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.35); background: #10161b; color: #dfe6e9; cursor: pointer; display: grid; place-items: center; transition: background .3s, transform .3s, opacity .3s }
  .mi svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round }
  .mi.fatto { opacity: .55 } .mi.ora { background: var(--green); color: #10140f; border-color: #fff; transform: scale(1.15) }
  #cTrack { position: relative; height: 26px; border-radius: 13px; background-color: #142338; background-repeat: no-repeat; background-position: 13px 0; background-size: calc(100% - 26px) 100% }
  #cTicks { position: absolute; left: 13px; right: 13px; top: 0; bottom: 0; pointer-events: none }
  #cTicks i { position: absolute; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; border-radius: 1px; background: rgba(255,255,255,.75) }
  #cTrack input { position: absolute; inset: 0; height: 26px }
  #sDay::-webkit-slider-runnable-track { height: 26px; background: transparent } #sDay::-moz-range-track { background: transparent } #sDay::-moz-range-progress { background: transparent }
  #sDay::-webkit-slider-thumb { width: 26px; height: 26px; margin-top: 0; background: #fff; border: 3px solid #10140f; box-shadow: 0 0 0 2px #fff, 0 2px 10px rgba(0,0,0,.6) }
  #sDay::-moz-range-thumb { width: 20px; height: 20px; background: #fff; border: 3px solid #10140f }
  #cOre { position: relative; height: 12px; margin: 0 13px; font: 500 10px/1 var(--body); color: var(--dim); font-variant-numeric: tabular-nums }
  #cOre span { position: absolute; top: 0; transform: translateX(-50%) } #cOre span:nth-child(1) { left: 0 } #cOre span:nth-child(2) { left: 25% } #cOre span:nth-child(3) { left: 50% } #cOre span:nth-child(4) { left: 75% } #cOre span:nth-child(5) { left: 100% }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: 0; background: transparent; cursor: pointer }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; border-radius: 50% }
  input[type=range]::-moz-range-thumb { border-radius: 50% }
  #cSheet { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--barH, 70px) + max(var(--pad), env(safe-area-inset-bottom)) + 10px); width: min(calc(100% - 2 * var(--pad)), 420px); pointer-events: auto;
    padding: 14px 16px 16px; border-radius: 16px; background: rgba(13,18,22,.95); border: 1px solid var(--green); box-shadow: 0 12px 40px rgba(0,0,0,.5); display: grid; gap: 10px }
  #cSheet[hidden] { display: none }
  #shHead { display: flex; align-items: center; justify-content: space-between; gap: 12px } #shNome { font: 700 22px/1 var(--display); letter-spacing: .06em; text-transform: uppercase }
  #shX { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 15px }
  #shText { margin: 0; font-size: 15px; line-height: 1.4; min-height: 2.8em } #shApri { justify-self: start }
  .tag { position: absolute; left: 0; top: 0; pointer-events: auto; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--green); color: #10140f; font: 700 14px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
    box-shadow: 0 6px 22px rgba(0,0,0,.45); white-space: nowrap; transition: opacity .35s }
  .tag::after { content: ""; position: absolute; left: calc(50% + var(--sx, 0px)); top: 100%; width: 2px; height: var(--gambo, 14px); background: var(--green); transform: translateX(-50%) }
  .tag.su { animation: pulsa 1.8s ease-in-out infinite } @keyframes pulsa { 50% { box-shadow: 0 0 0 7px rgba(169,189,143,.32), 0 6px 22px rgba(0,0,0,.45) } }
  @media (max-width: 560px) {
    #cCard { padding: 8px 12px 9px } #cHour { font-size: 22px } #cTit { font-size: 14px } #cNum { display: none } #cText { font-size: 13.5px; line-height: 1.33 }
    #cBar { flex-wrap: wrap; gap: 8px; padding: 8px 10px } #cOpt { width: 100%; justify-content: space-between } .seg button { min-height: 36px; padding: 0 9px; font-size: 12px; letter-spacing: .05em } #cRun { flex-basis: 100% }
    .tag { min-height: 34px; padding: 0 12px; font-size: 13px } }
  @media (max-height: 460px) {
    #cCard { top: calc(max(var(--pad), env(safe-area-inset-top)) + 38px); width: min(36%, 300px); padding: 8px 12px 9px }
    #cHour { font-size: 20px } #cTit { font-size: 13px } #cNum { display: none } #cText { margin-top: 4px; font-size: 12.5px; line-height: 1.3 }
    #cBar { width: min(calc(100% - 2 * var(--pad)), 820px); flex-wrap: nowrap; padding: 5px 8px; gap: 8px } #cOpt { width: auto } .seg button { min-height: 34px; padding: 0 9px; font-size: 11.5px }
    #bPlay { width: 40px; height: 40px } #cIcons { height: 28px } .mi { width: 28px; height: 28px; margin-left: -14px } .mi svg { width: 15px; height: 15px } #cOre { display: none } #bHome { min-height: 36px; font-size: 13px; padding: 0 12px }
    #cSheet { padding: 10px 14px 12px; gap: 6px } #shNome { font-size: 18px } #shText { font-size: 13px; min-height: 0 } .tag { min-height: 32px; font-size: 12px } }

  #prod { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg) } #prod[hidden] { display: none }
  body[data-scena=prodotto] #top { display: none }
  body[data-scena=casa] #top { background: linear-gradient(rgba(5,8,10,.72), transparent) }
  #veil { position: absolute; inset: 0; background: var(--bg); opacity: 1; pointer-events: none; transition: opacity .38s ease }
  body.pronto #veil { opacity: 0 } body.pronto #veil.on { opacity: 1; pointer-events: auto }
  @media (max-height: 460px) { #hName { font-size: 30px } #hInfo { gap: 5px; padding-top: 16px } #hNum, .credit, #hHint { display: none } .big, .btn { min-height: 42px } }
  @media (max-width: 480px) { .freccia { top: 36% } }
  body.solo .freccia, body.solo #hNum { display: none }
  /* fotogramma per l'anteprima del link (og.jpg): si attiva da script con la classe "og" */
  #ogT { display: none; position: absolute; left: 44px; bottom: 40px; right: 44px; text-shadow: 0 2px 18px rgba(0,0,0,.7) } #ogT b { display: block; font: 700 92px/.95 var(--display); letter-spacing: .03em; text-transform: uppercase } #ogT span { display: block; margin-top: 12px; font: 500 30px/1.2 var(--body) }
  body.og .scena, body.og #by { display: none !important } body.og #ogT { display: block } body.og #logo { width: 190px } body.og #top { padding: 36px 44px }
  body.og #stage::after { content: ""; position: absolute; inset: 45% 0 0 0; background: linear-gradient(transparent, rgba(5,8,10,.85)); pointer-events: none } body.og #ogT { z-index: 2 }
  @media (prefers-reduced-motion: reduce) { #veil { transition: none } }
</style>
</head>
<body data-scena="">
<div id="stage">
  <canvas id="gl" aria-label="Casa Unical: i prodotti Unical in tre dimensioni"></canvas>
  <header id="top"><div id="logo"></div><div id="by">Casa Unical</div></header>

  <section id="home" class="scena" aria-label="I prodotti">
    <p id="hHint">Trascina per girare · tocca il prodotto per aprirlo</p>
    <button class="btn freccia" id="bPrev" type="button" aria-label="Prodotto precedente">&#8249;</button>
    <button class="btn freccia" id="bNext" type="button" aria-label="Prodotto successivo">&#8250;</button>
    <div id="hInfo">
      <div id="hNum">01 / 01</div>
      <h1 id="hName">UHP 120</h1>
      <p id="hLine"></p>
      <div id="hRow"><button class="big" id="bOpen" type="button">Apri</button><button class="btn" id="bCasa" type="button">Entra nella casa</button></div>
    </div>
  </section>

  <section id="casa" class="scena" aria-label="La casa">
    <div id="cSpot"></div>
    <div id="tags"></div>
    <button class="btn" id="bHome" type="button">&#8249; Prodotti</button>
    <div id="cCard">
      <div id="cHead"><b id="cHour">06:15</b><span id="cTit"></span><span id="cNum"></span></div>
      <p id="cText" aria-live="polite"></p>
    </div>
    <div id="cSheet" role="dialog" aria-labelledby="shNome" hidden>
      <div id="shHead"><b id="shNome"></b><button id="shX" type="button" aria-label="Chiudi">&#10005;</button></div>
      <p id="shText"></p>
      <button class="big" id="shApri" type="button">Apri</button>
    </div>
    <div id="cBar">
      <div id="cOpt">
        <div class="seg" role="group" aria-label="Stagione"><button id="bInv" type="button" aria-pressed="true">Inverno</button><button id="bEst" type="button" aria-pressed="false">Estate</button></div>
        <div class="seg" id="cGen" role="group" aria-label="Generatore" hidden><button id="bUhp" type="button" aria-pressed="true">Pompa di calore</button><button id="bIbr" type="button" aria-pressed="false">Ibrido</button></div>
      </div>
      <div id="cRun">
        <button class="tondo" id="bPlay" type="button" aria-label="Pausa"></button>
        <div id="cDay">
          <div id="cIcons"></div>
          <div id="cTrack"><div id="cTicks"></div><input type="range" id="sDay" min="0" max="24" step="0.05" value="6" aria-label="Ora del giorno"></div>
          <div id="cOre"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>
        </div>
      </div>
    </div>
  </section>

  <div id="ogT"><b>Casa Unical</b><span>I prodotti Unical al lavoro dentro una casa.</span></div>
  <iframe id="prod" title="Prodotto" hidden allow="autoplay; fullscreen"></iframe>
  <div id="veil"></div>
</div>
<script type="module">
/*SCRIPT*/
</script>
</body>
</html>

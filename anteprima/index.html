<style>

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t;

const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// texture disegnate su canvas
function cv(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const rep = (t, x, y) => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(x, y); return t; };

const mesh = (g, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); return o; };
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d), rbox = (w, h, d, r = .01) => new RoundedBoxGeometry(w, h, d, 2, r);

// ───────── HP 300PSDX · livello leggero per Home e Casa ─────────
// Quote dal manuale installatore 00340944, p.14-15 (vedi src/dati/acs.json): Ø 600, altezza 1990 con piedini (35) e imbocchi aria (40),
// coperchio con imbocchi 445, imbocchi Ø 177 a interasse 320, attacchi sul fianco destro alle altezze 32,5 / 235 / 855 / 1170 / 1270 / 1370 dal fondo.

registra({

  alto: 1.99, ordine: 2,
  costruisci() {
    const g = new THREE.Group(), B = .035, R = .30, YC = B + 1.51;   // B = piedini, YC = dove comincia il coperchio (1990 - 445)
    const argento = std({ color: 0xb4b8bb, roughness: .38, metalness: .75 }), nero = std({ color: 0x1b1d20, roughness: .45, metalness: .1 }), gomma = std({ color: 0x0c0c0d, roughness: .95 });
    const ottone = std({ color: 0xb08a3c, roughness: .35, metalness: .8 });
    for (let i = 0; i < 3; i++) { const a = i * PI * 2 / 3 + PI / 6; g.add(mesh(cyl(.03, B, 12), gomma, Math.sin(a) * .22, B / 2, Math.cos(a) * .22)); }
    g.add(mesh(cyl(R, YC - B, 48), argento, 0, (YC + B) / 2, 0));
    g.add(mesh(cyl(R + .003, .02, 48), nero, 0, YC - .01, 0));
    const prof = [[R, 0], [R, .06], [.296, .26], [.275, .355], [.235, .4], [0, .405]].map(([r, y]) => new THREE.Vector2(r, y));
    g.add(mesh(new THREE.LatheGeometry(prof, 48), nero, 0, YC, 0));
    // imbocchi aria Ø 177 con griglia, interasse 320
    const tGr = cv(64, 64, (c, w, h) => { c.fillStyle = '#0b0c0d'; c.fillRect(0, 0, w, h); c.strokeStyle = '#3a3d41'; c.lineWidth = 3; for (let r = 6; r < 32; r += 7) { c.beginPath(); c.arc(32, 32, r, 0, 7); c.stroke(); } for (let a = 0; a < 6; a++) { c.beginPath(); c.moveTo(32, 32); c.lineTo(32 + Math.cos(a * PI / 3) * 30, 32 + Math.sin(a * PI / 3) * 30); c.stroke(); } });
    for (const x of [-.16, .16]) { g.add(mesh(cyl(.0885, .04, 28), nero, x, YC + .425, 0)); const d = mesh(new THREE.CircleGeometry(.08, 28), std({ map: tGr, roughness: .6 }), x, YC + .446, 0); d.rotation.x = -PI / 2; g.add(d); }
    // interfaccia utente sul coperchio
    const tUI = cv(96, 96, (c, w, h) => { c.fillStyle = '#101214'; c.fillRect(0, 0, w, h); c.fillStyle = '#9fd8ff'; c.font = '700 34px sans-serif'; c.fillText('55°', 16, 58); });
    const ui = mesh(new THREE.PlaneGeometry(.1, .1), new THREE.MeshBasicMaterial({ map: tUI }), 0, YC + .2, .297); ui.rotation.x = -.14; g.add(ui);
    g.add(mesh(rbox(.13, .13, .02, .008), std({ color: 0x2a2d31, roughness: .4 }), 0, YC + .2, .287));
    // attacchi sul fianco destro (rispetto al pannello): fredda, al solare, dal solare, anodo, calda, condensa
    const att = h => V(R + .012, B + h, 0);
    for (const h of [.0325, .235, .855, 1.17, 1.27, 1.37]) { const a = mesh(cyl(h === 1.37 ? .011 : .014, .03, 14), h === 1.17 ? nero : ottone); a.position.copy(att(h)); a.rotation.z = PI / 2; g.add(a); }
    // coperture posteriori di resistenza (950) e termostato (1150)
    for (const h of [.95, 1.15]) { const a = rad(205), c = mesh(cyl(.05, .012, 20), nero, Math.sin(a) * (R + .004), B + h, Math.cos(a) * (R + .004)); c.rotation.order = 'YXZ'; c.rotation.set(PI / 2, a, 0); g.add(c); }
    const led = ui.material;
    return { group: g, attacchi: { fredda: att(.0325).setX(R + .03), calda: att(1.27).setX(R + .03) }, tick(dt, carico = 0) { led.color.setScalar(.75 + .25 * carico); } };
  },
});

const CLM = (() => {

  const console = () => { const g = new THREE.Group(); g.add(mesh(rbox(.794, .621, .206, .02), bianco, 0, .3105, .103)); for (let i = 0; i < 12; i++) g.add(mesh(box(.68, .004, .006), grig, 0, .14 + i * .03, .208)); g.add(mesh(box(.6, .006, .08), grig, 0, .62, .1)); return g; };
  const esterna = (W, H, D) => { const g = new THREE.Group(), XP = W / 2 - .25, FX = (-W / 2 + XP) / 2, R = Math.min(.22, (XP + W / 2) / 2 - .03);
    g.add(mesh(rbox(W, H, D, .015), std({ color: 0xd6d8da, roughness: .55 }), 0, H / 2 + .03, 0));
    const gr = mesh(new THREE.CircleGeometry(R, 32), scuro, FX, H / 2 + .03, D / 2 + .002); g.add(gr); for (let i = 1; i < 6; i++) { const t = mesh(new THREE.TorusGeometry(R * i / 6, .002, 4, 40), grig, FX, H / 2 + .03, D / 2 + .004); g.add(t); }
    for (const x of [-W * .3, W * .3]) g.add(mesh(box(.06, .03, .274), nero, x, .015, 0)); return g; };
  return { parete, console, esterna };
})();

// ───────── Fotovoltaico Unical · livello leggero per Home e Casa ─────────
// MULTIVOLT 460 BF (scheda 00341524): 1762 x 1134 x 30 mm, 96 mezze celle 6 x 16, doppio vetro, telaio in alluminio.
// ZOE1-6000 (manuale 00341435 p.22, 75): 540 x 450 x 185 mm, frontale chiaro con scritta Unical in alto e schermo LCD in basso al centro.
// SUM BL15P (manuale 00341436 p.13-14, 36): tre moduli da 650 x 360 x 180 mm impilati su una base, etichetta-display al centro con 4 tacche di carica.
// Ricostruito: altezza della base della batteria (50 mm, ricavata dai 770 mm per due moduli della guida rapida), colore esatto degli involucri (bianco dalle foto).
const FV = (() => {
  const tMod = cv(256, 128, (c, w, h) => { c.fillStyle = '#07090c'; c.fillRect(0, 0, w, h); const cw = (w - 12) / 16, ch = (h - 8) / 6;
    for (let i = 0; i < 16; i++) for (let j = 0; j < 6; j++) { c.fillStyle = (i + j) % 2 ? '#10161f' : '#0e141c'; c.fillRect(4 + i * cw + (i > 7 ? 4 : 0) + .6, 4 + j * ch + .6, cw - 1.2, ch - 1.2); } });
  const vetro = std({ map: tMod, roughness: .18, metalness: .35 }), telaio = std({ color: 0x15171a, roughness: .5, metalness: .6 });
  // modulo sdraiato: lunghezza lungo x, larghezza lungo z, faccia superiore con le celle
  const modGeo = box(1.762, .03, 1.134), modMat = [telaio, telaio, vetro, telaio, telaio, telaio];
  const bianco = std({ color: 0xe9ebec, roughness: .45, metalness: .05 }), grigio = std({ color: 0x9aa0a5, roughness: .5, metalness: .4 }), nero = std({ color: 0x15171a, roughness: .5 });
  function inverter() {
    const g = new THREE.Group(); g.add(mesh(rbox(.54, .45, .14, .02), bianco, 0, 0, .045 + .07)); g.add(mesh(box(.46, .40, .045), grigio, 0, 0, .0225));   // corpo e radiatore sul retro
    const tL = cv(256, 80, c => drawUnicalLogo(c, 8, 6, 230)); g.add(mesh(new THREE.PlaneGeometry(.15, .047), std({ map: tL, transparent: true, roughness: .5 }), 0, .15, .1865));
    const tD = cv(64, 48, c => { c.fillStyle = '#0d1114'; c.fillRect(0, 0, 64, 48); c.fillStyle = '#7fd0ff'; c.fillRect(8, 8, 48, 18); c.fillStyle = '#3a4046'; for (let i = 0; i < 4; i++) c.fillRect(8 + i * 13, 32, 9, 9); });
    g.add(mesh(new THREE.PlaneGeometry(.1, .075), new THREE.MeshBasicMaterial({ map: tD }), 0, -.13, .1865));
    for (const x of [-.2, -.12, -.04, .05, .13, .2]) g.add(mesh(cyl(.012, .03, 10), nero, x, -.24, .1));      // terminali sul lato inferiore
    return g;
  }
  function batteria(n = 3) {
    const g = new THREE.Group(), tLed = cv(32, 96, () => {}), led = new THREE.MeshBasicMaterial({ map: tLed });
    g.add(mesh(box(.65, .05, .18), grigio, 0, .025, 0));
    for (let i = 0; i < n; i++) { g.add(mesh(rbox(.65, .355, .18, .012), bianco, 0, .05 + .18 + i * .36, 0)); g.add(mesh(new THREE.PlaneGeometry(.025, .075), led, 0, .05 + .18 + i * .36, .0905)); }
    let ult = -1;
    function carica(soc) { const k = Math.round(clamp(soc) * 4); if (k === ult) return; ult = k; const c = tLed.image.getContext('2d'); c.fillStyle = '#0d1114'; c.fillRect(0, 0, 32, 96); for (let i = 0; i < 4; i++) { c.fillStyle = i < k ? '#7dff9a' : '#27302b'; c.fillRect(8, 74 - i * 20, 16, 12); } tLed.needsUpdate = true; }
    carica(.5); return { group: g, carica, alto: .05 + n * .36 };
  }
  return { modGeo, modMat, inverter, batteria };
})();

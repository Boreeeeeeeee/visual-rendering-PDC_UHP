<style>

    #cTop { top: var(--pad); left: calc(var(--pad) + 110px); right: calc(var(--pad) + 130px); flex-direction: row; align-items: center } #cCap { padding: 6px 12px; flex: 1; max-width: 520px } #cHour { font-size: 24px } #cText { min-height: 0; font-size: 12px; line-height: 1.25 }
    #cPanel { flex-direction: row; align-items: center; padding: 6px 10px; gap: 12px; width: min(calc(100% - 2 * var(--pad)), 760px) } #cRow { flex-wrap: nowrap } .seg button, #bPlay { min-height: 40px; padding: 0 12px } #cGen { position: absolute; left: 0; bottom: calc(100% + 8px); background: var(--panel); backdrop-filter: blur(10px) } }

<script type="module">
// ───────── logo Unical ─────────
// Tracciato vettoriale preso dai PDF Unical (scheda MULTIVOLT 460 BF, cod. 00341524, p.2), usato con il via libera di Bore (12 novembre 2026).
// Coordinate riportate a un riquadro 1022,7 x 302,7; rosso del logo #e30613.
const UNICAL_LOGO = { w: 1022.7, h: 302.7, color: '#e30613', d: 'M 885 220.8 C 885 246.7 865.9 259.1 840.8 261.6 C 825.9 263 802.3 255.5 802.3 236 C 802.3 212.9 822.9 201.2 844.1 197.6 C 867.7 194 879.3 198.1 885 193.7 Z M 943.4 139.1 C 943.4 87 885.1 80.1 854.5 79.2 C 819.8 78.1 770.7 88.8 757.5 154.8 L 807.9 154.8 C 811.6 136.7 822.3 117 852.7 118.8 C 872.5 119.8 885 126.7 885 148.7 C 885 160.6 876.5 162.9 867.5 164.1 L 816.1 171.4 C 779.8 176.6 750.5 199.3 750.5 240.7 C 750.5 284.5 798.4 302.7 830.9 300 C 863.2 297.3 876.2 287.9 889.3 274.8 C 889.8 284.2 888.4 289 892.8 295.1 L 947 295.1 C 947 295.1 945.6 293.3 944.7 291.2 C 943 287.3 943.5 274.9 943.4 259.1 Z M 943.4 139.1 M 439.4 151.1 C 439.4 105.5 407.8 81.8 367.2 81.8 C 327.8 81.8 312.3 105.2 304.8 117.6 L 304.1 117.6 L 304.1 83.9 L 251.8 83.9 L 251.8 295.1 L 307.9 295.1 L 307.9 171.6 C 307.9 143.3 324.7 128.8 346.2 128.8 C 379.1 128.8 381.8 154.8 381.8 170 L 381.8 295.1 L 439.4 295.1 Z M 439.4 151.1 M 688.4 222 C 688.4 231.8 676.6 259.9 646 260.5 C 596.6 261.6 593.7 211.8 594.2 189 C 594.8 163.2 598.8 119.7 642.6 118.8 C 674.6 118.2 682.8 139.9 687.1 154.8 L 738.8 154.8 C 734.4 102 682.8 79.1 645.6 79.1 C 577 79.1 538 133.8 539.6 198 C 540.8 242.1 569.5 301 643.1 300.2 C 720.9 299.5 738 243.6 740 222 Z M 688.4 222 M 113.8 300.5 C 53.5 300.5 0 270.8 0 200.6 L 0 0 L 60.2 0 L 60.2 196.7 C 60.2 235 78.8 249.7 110.5 250.5 C 112.2 250.6 115.5 250.6 117.1 250.5 C 148.8 249.7 167.5 235 167.5 196.6 C 167.5 147.5 167.5 0 167.5 0 L 227.7 0 L 227.7 200.6 C 227.7 270.8 174.1 300.5 113.8 300.5 M 518.6 47.7 L 463.5 47.7 L 463.5 0 L 518.6 0 Z M 518.6 47.7 M 518.6 295.1 L 463.5 295.1 L 463.5 83.9 L 518.6 83.9 Z M 518.6 295.1 M 1022.7 295.1 L 967.6 295.1 L 967.6 0 L 1022.7 0 Z M 1022.7 295.1' };
// Disegna il logo su un canvas 2D con l'angolo in alto a sinistra in (x, y) e la larghezza data.
function drawUnicalLogo(g, x, y, width, color) {
  const k = width / UNICAL_LOGO.w; g.save(); g.translate(x, y); g.scale(k, k); g.fillStyle = color || UNICAL_LOGO.color; g.fill(new Path2D(UNICAL_LOGO.d), 'evenodd'); g.restore();
}
const unicalLogoSvg = (color) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${UNICAL_LOGO.w} ${UNICAL_LOGO.h}" role="img" aria-label="Unical"><path fill="${color || UNICAL_LOGO.color}" fill-rule="evenodd" d="${UNICAL_LOGO.d}"/></svg>`;

import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ───────── base del sito: utilità, resa, registro dei prodotti ─────────
const $ = id => document.getElementById(id);
const PI = Math.PI, rad = d => d * PI / 180;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t;
const sm = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

try { await Promise.race([Promise.all([document.fonts.load('700 40px "Barlow Condensed"'), document.fonts.load('600 20px Barlow')]), new Promise(r => setTimeout(r, 1200))]); } catch (e) {}

const canvas = $('gl'), stage = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const COARSE = matchMedia('(pointer: coarse)').matches;      // telefono o tablet
let PR = Math.min(window.devicePixelRatio || 1, COARSE ? 1.5 : 2);   // rapporto pixel: scende da solo se la resa è lenta
renderer.setPixelRatio(PR);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const ENV = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.03).texture;
const ANTEPRIMA = /\/anteprima\//.test(location.pathname) || /[?&]segnaposti/.test(location.search);   // i segnaposti compaiono solo qui

// texture disegnate su canvas
function cv(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const rep = (t, x, y) => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(x, y); return t; };
const std = o => new THREE.MeshStandardMaterial(o);
const mesh = (g, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); return o; };
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d), rbox = (w, h, d, r = .01) => new RoundedBoxGeometry(w, h, d, 2, r);
const cyl = (r, h, n = 24) => new THREE.CylinderGeometry(r, r, h, n);

// pavimento da studio con griglia, come nella pagina della UHP
const T_GRID = rep(cv(256, 256, (g, w, h) => { g.fillStyle = '#0c1115'; g.fillRect(0, 0, w, h); g.strokeStyle = 'rgba(150,190,220,.20)'; g.lineWidth = 2; g.strokeRect(0, 0, w, h); }), 40, 40);

// ───────── registro dei prodotti ─────────
// Ogni prodotto si registra con: id, nome, riga (una frase), pagina (cartella della pagina completa, o null se non è ancora fatto),
// costruisci() -> { group, tick(dt, carico, freddo) } per il livello leggero, e i dati per il suo posto nella casa.
const PRODOTTI = [];
const registra = def => PRODOTTI.push(def);

// ───────── HP 300PSDX · livello leggero per Home e Casa ─────────
// Quote dal manuale installatore 00340944, p.14-15 (vedi src/dati/acs.json): Ø 600, altezza 1990 con piedini (35) e imbocchi aria (40),
// coperchio con imbocchi 445, imbocchi Ø 177 a interasse 320, attacchi sul fianco destro alle altezze 32,5 / 235 / 855 / 1170 / 1270 / 1370 dal fondo.
// Ricostruito: l'angolo degli attacchi e delle coperture attorno al cilindro e il verso dei due imbocchi (il manuale dà solo le altezze).
registra({
  id: 'acs', nome: 'HP 300PSDX', riga: 'Scaldacqua a pompa di calore da 300 litri, propano R290', apri: 'Apri l\'HP 300PSDX', pagina: 'acs/',
  alto: 1.99, ordine: 2,
  costruisci() {
    const g = new THREE.Group(), B = .035, R = .30, YC = B + 1.51;   // B = piedini, YC = dove comincia il coperchio (1990 - 445)
    const argento = std({ color: 0xb4b8bb, roughness: .38, metalness: .75 }), nero = std({ color: 0x1b1d20, roughness: .45, metalness: .1 }), gomma = std({ color: 0x0c0c0d, roughness: .95 });
    const ottone = std({ color: 0xb08a3c, roughness: .35, metalness: .8 });
    for (let i = 0; i < 3; i++) { const a = i * PI * 2 / 3 + PI / 6; g.add(mesh(cyl(.03, B, 12), gomma, Math.sin(a) * .22, B / 2, Math.cos(a) * .22)); }
    g.add(mesh(cyl(R, YC - B, 48), argento, 0, (YC + B) / 2, 0));
    g.add(mesh(cyl(R + .003, .02, 48), nero, 0, YC - .01, 0));
    const prof = [[R, 0], [R, .06], [.296, .26], [.275, .355], [.235, .4], [0, .405]].map(([r, y]) => new THREE.Vector2(r, y));

// #home (o niente) = cerchio dei prodotti · #casa = la casa · #<id prodotto> = pagina completa del prodotto, caricata solo quando serve.
$('logo').innerHTML = unicalLogoSvg();
const SCENE = { home: Home, casa: Casa };
let attiva = null, nome = '', ultima = 'home', inCorso = false;
const velo = $('veil'), prod = $('prod');
const attendi = ms => new Promise(r => setTimeout(r, ms));
const prodotto = id => PRODOTTI.find(p => p.id === id && p.pagina);

function resize() { const w = Math.max(2, stage.clientWidth), h = Math.max(2, stage.clientHeight); renderer.setSize(w, h, false); Home.resize(w, h); Casa.resize(w, h); }
addEventListener('resize', resize); new ResizeObserver(resize).observe(stage); resize();

async function vai(dest, subito) {
  if (dest === nome || inCorso) return; inCorso = true;
  const p = prodotto(dest);
  if (!SCENE[dest] && !p) dest = 'home';
  if (!subito) { velo.classList.add('on'); await attendi(380); }
  document.body.dataset.scena = p ? 'prodotto' : dest; nome = dest;
  if (p) {              // il livello completo vive in una pagina a sé: si carica ora e si scarica uscendo, così la memoria torna libera
    attiva = null; prod.hidden = false; await new Promise(r => { prod.onload = r; prod.src = p.pagina; setTimeout(r, 6000); });
    document.title = p.nome + ' · Casa Unical';
  } else {
    if (!prod.hidden) { prod.hidden = true; prod.removeAttribute('src'); prod.src = 'about:blank'; }
    attiva = SCENE[dest]; ultima = dest; attiva.entra(); last = 0; document.title = dest === 'casa' ? 'La casa · Casa Unical' : 'Casa Unical';
  }
  velo.classList.remove('on'); inCorso = false;
  const h = location.hash.slice(1); if (h !== nome && !(h === '' && nome === 'home')) rotta();   // l'indirizzo è cambiato durante il passaggio
}
function rotta() {
  let h = location.hash.slice(1).toLowerCase();
  if (h === 'indietro') { history.replaceState(null, '', '#' + ultima); h = ultima; }
  vai(h || 'home', !nome);
}
addEventListener('hashchange', rotta);
const apri = h => { if (location.hash.slice(1) === h) rotta(); else location.hash = h; };

// Home
if (Home.voci.length < 2) { document.body.classList.add('solo'); $('hHint').textContent = 'Tocca il prodotto per aprirlo'; }
const fmtN = i => String(i + 1).padStart(2, '0') + ' / ' + String(Home.voci.length).padStart(2, '0');
Home.su(v => apri(v.id), (v, i) => {
  $('hNum').textContent = fmtN(i); $('hName').textContent = v.nome; $('hLine').textContent = v.riga;
  const b = $('bOpen'); b.disabled = !v.fatto; b.firstChild.textContent = v.fatto ? (v.apri || 'Apri') : 'In arrivo';
});
$('bOpen').onclick = () => { const v = Home.voci[Home.sel]; if (v.fatto) apri(v.id); };
$('bCasa').onclick = () => apri('casa'); $('bPrev').onclick = () => Home.gira(-1); $('bNext').onclick = () => Home.gira(1);
addEventListener('keydown', e => { if (nome !== 'home') return; if (e.key === 'ArrowLeft') Home.gira(-1); if (e.key === 'ArrowRight') Home.gira(1); if (e.key === 'Enter') $('bOpen').click(); });

// Casa
const sDay = $('sDay'), hh = t => { const m = Math.round(t * 60) % 1440; return String(m / 60 | 0).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const tags = Casa.viste.map(v => { const b = document.createElement('button'); b.type = 'button'; b.className = 'tag'; b.textContent = v.def.nome + ' ›'; b.onclick = () => apri(v.def.id); $('tags').appendChild(b); return b; });
Casa.su(p => apri(p.id), (S, testo) => {
  $('cHour').textContent = hh(S.t); $('cText').textContent = testo; sDay.value = S.t; sDay.style.setProperty('--f', (S.t / 24 * 100) + '%');
  $('bInv').setAttribute('aria-pressed', !S.estate); $('bEst').setAttribute('aria-pressed', S.estate); $('bPlay').setAttribute('aria-pressed', S.play); $('bPlay').textContent = S.play ? 'Pausa' : 'Avvia';
  $('bUhp').setAttribute('aria-pressed', S.gen !== 'ibrido'); $('bIbr').setAttribute('aria-pressed', S.gen === 'ibrido'); tags[0].textContent = Casa.viste[0].def.nome + ' ›';
  const k = $('cCal'); k.hidden = !(S.gen === 'ibrido' && S.caldaia > .5); k.textContent = 'Caldaia accesa'; k.dataset.m = 'on';
  $('cStato').textContent = S.carico < .03 ? 'A riposo' : (S.estate ? 'Raffresca' : 'Riscalda'); $('cStato').dataset.m = S.carico < .03 ? 'off' : (S.estate ? 'f' : 'c');
  const f = $('cFv'); f.hidden = !S.fv; f.textContent = S.pv > .05 ? (S.bat > .01 ? 'Sole: alimenta la casa e carica la batteria' : S.rete > .02 ? 'Sole: batteria piena, il resto va in rete' : S.rete < -.02 ? 'Poco sole: la rete aiuta' : 'Sole: alimenta la casa') : (S.bat < -.01 ? 'Buio: la batteria alimenta la casa' : 'Buio: la casa prende dalla rete'); f.dataset.m = S.pv > .05 ? 's' : 'off';
  const a = $('cAcs'); a.textContent = S.doccia ? 'Doccia: esce acqua calda' : S.sole ? 'Acqua calda: il sole la porta a 65 °C' : S.ricarica ? 'Acqua calda: si ricarica' : 'Acqua calda: pronta'; a.dataset.m = S.doccia ? 'c' : S.ricarica ? 'r' : 'off';
}, (i, x, y, vis) => { const tag = tags[i]; tag.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`; tag.style.visibility = vis ? 'visible' : 'hidden'; });
sDay.addEventListener('input', () => { const v = +sDay.value; Casa.play(false); Casa.ora(v); });   // il valore si legge prima: fermare la giornata riscrive il cursore
$('bPlay').onclick = () => Casa.play(!Casa.S.play); $('bInv').onclick = () => Casa.stagione(false); $('bEst').onclick = () => Casa.stagione(true);
$('bHome').onclick = () => apri('home');
if (Casa.ibrido) { $('cGen').hidden = false; $('bUhp').onclick = () => Casa.generatore('uhp'); $('bIbr').onclick = () => Casa.generatore('ibrido'); }

// gesti sulla scena attiva
canvas.addEventListener('pointerdown', e => { if (!attiva) return; canvas.setPointerCapture(e.pointerId); attiva.down(e); });
canvas.addEventListener('pointermove', e => attiva && attiva.move(e));
for (const ev of ['pointerup', 'pointercancel']) canvas.addEventListener(ev, e => attiva && attiva.up(e));
canvas.addEventListener('wheel', e => { if (attiva && attiva.wheel) { e.preventDefault(); attiva.wheel(e); } }, { passive: false });

// ciclo di disegno: fermo mentre è aperto un prodotto; se la resa è lenta il rapporto pixel scende da solo
let last = 0, lenti = 0, veloci = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!attiva || document.hidden) { last = 0; return; }
  const now = ts / 1000, dt = last ? Math.min(.05, now - last) : 0, grezzo = last ? now - last : 0; last = now;
  attiva.tick(dt, now); renderer.render(attiva.scene, attiva.camera);
  if (grezzo > .036) { if (++lenti > 45 && PR > .8) { PR = Math.max(.8, PR - .25); renderer.setPixelRatio(PR); resize(); lenti = 0; } } else if (grezzo) lenti = Math.max(0, lenti - 1);
}
// per le prove automatiche
window.__casa = { vai: apri, Home, Casa, info: () => renderer.info.render, stato: () => ({ scena: prodotto(nome) ? 'prodotto' : nome, prodotto: prodotto(nome) ? nome : null, pr: PR, home: Home.stato(), ora: Casa.S.t, estate: Casa.S.estate, pv: +Casa.S.pv.toFixed(3), bat: +Casa.S.bat.toFixed(3), rete: +Casa.S.rete.toFixed(3), soc: +Casa.S.soc.toFixed(3), sole: Casa.S.sole, doccia: Casa.S.doccia, caldo: +Casa.S.caldo.toFixed(3), ricarica: Casa.S.ricarica, carico: +Casa.S.carico.toFixed(3), gen: Casa.S.gen, caldaia: +Casa.S.caldaia.toFixed(3) }),
  passo(n = 1, dt = 1 / 30) { for (let i = 0; i < n; i++) { last += dt; attiva && attiva.tick(dt, last); } attiva && renderer.render(attiva.scene, attiva.camera); } };
rotta(); document.body.classList.add('pronto'); requestAnimationFrame(frame);

</script>
</body>
</html>
